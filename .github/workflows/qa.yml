name: QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-pages:
    name: Check site routes and assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check syntax and whitespace
        run: |
          git diff --check HEAD^ HEAD
          node --check assets/js/app.js
          node --check assets/js/content.js
          node --check assets/js/start.js
      - name: Check local page links and assets
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urljoin, urlsplit

          class Page(HTMLParser):
              def __init__(self, file):
                  super().__init__()
                  self.links = []
                  self.ids = set()
                  self.feed(file.read_text(encoding='utf-8'))

              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key == 'id' and value:
                          self.ids.add(value)
                      if key in ('src', 'href') and value:
                          self.links.append(value)
                      if key == 'srcset' and value:
                          self.links.extend(item.split()[0] for item in value.split(','))

          root = 'https://example.invalid/KP/'
          for route in ('', 'details/', 'start/'):
              file = Path(route) / 'index.html'
              for link in Page(file).links:
                  if urlsplit(link).scheme or urlsplit(link).netloc:
                      continue
                  target = urlsplit(urljoin(root + route, link))
                  assert target.path.startswith('/KP/'), (file, link)
                  path = Path(unquote(target.path.removeprefix('/KP/')))
                  if path.is_dir():
                      path /= 'index.html'
                  assert path.is_file(), (file, link, path)
                  if target.fragment and path.suffix == '.html':
                      assert unquote(target.fragment) in Page(path).ids, (file, link)
          PY
